name: Bug report
description: Something looks wrong or doesn't work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check [Troubleshooting](../blob/main/docs/troubleshooting.md) first: many problems come from an old copy of the plugin or a snippet.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you see, and what you expected instead. Screenshots or the exported PDF help a lot.
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: A small note that shows it
      description: The Markdown of the smallest note you can make that shows the problem, front matter included.
      render: markdown
  - type: dropdown
    id: view
    attributes:
      label: Where
      multiple: true
      options: [Reading view, Editing view, PDF export, Settings page]
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Shown at the top of Settings → Lined Paper Pages.
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      description: Settings → General.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and display scaling
      placeholder: Windows 11, 125 %
